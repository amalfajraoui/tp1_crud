services:
  db:
    image: postgres:17-alpine
    container_name: crud-db
    environment:
      - POSTGRES_DB=tp1
      - POSTGRES_USER=tp1
      - POSTGRES_PASSWORD=tp1pass

    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tp1-net

  backend:
    build: ./backend
    container_name: crud-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://tp1:tp1pass@db:5432/tp1
    depends_on:
      - db
    networks:
      - tp1-net

  frontend:
    build: ./frontend
    container_name: crud-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - tp1-net

  prometheus:
    image: prom/prometheus:latest
    container_name: crud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - tp1-net

  grafana:
    image: grafana/grafana:latest
    container_name: crud-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tp1-net

  jenkins:
    build: ./jenkins
    container_name: crud-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tp1-net

volumes:
  pgdata:
  grafana-data:
  jenkins-data:

networks:
  tp1-net: